services:
  - type: web
    name: TradingBot
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRONTEND_ORIGIN
        value: https://revanth0817.github.io/TradingBot
      - key: APP_ENV
        value: production
